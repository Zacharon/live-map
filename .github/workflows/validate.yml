name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Verify locked dependency installation and peer compatibility
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run syntax and route export checks
        run: npm run check

      - name: Run platform and source-boundary regressions
        run: npm run test:platform && npm run test:audit-repair

      - name: Run Live Map validator
        run: npm run validate

  forge-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Live Map candidate
        uses: actions/checkout@v7
        with:
          path: live-map

      - name: Check out reviewed Forge implementation
        uses: actions/checkout@v7
        with:
          repository: Zacharon/osint-forge
          ref: 239c9570238230c110f474db4ec9246d59b3aa1e
          path: osint-forge
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install local SQL test dependencies
        working-directory: live-map
        run: npm ci --ignore-scripts

      - name: Run fixture-only Forge HTTP integration
        working-directory: live-map
        run: npm run test:forge-staging -- ../osint-forge
