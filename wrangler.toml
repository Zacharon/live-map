name = "live-map"
main = "src/worker.js"
compatibility_date = "2026-06-14"
compatibility_flags = ["nodejs_compat"]

# Public API abuse protection is implemented in src/api/rate-limit.js.
# It intentionally uses no paid-only bindings so the Worker remains Free-compatible.

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
# Pages go through the Worker so it can add the same security headers as
# netlify.toml (src/security-headers.js). Other static assets are served directly.
run_worker_first = ["/api/*", "/sources", "/", "/index.html", "/globe", "/globe.html", "/about", "/about.html", "/countries", "/countries.html", "/diagnostics", "/diagnostics.html", "/source-explorer", "/source-explorer.html", "/404.html"]
