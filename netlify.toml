# Cesium's vendored bundle and the Natural Earth pyramid do not change between deploys of a commit.
# This adds Cache-Control only. The CSP stays on the /vendor/* rule above so the response does not get two policies.
[[headers]]
  for = "/vendor/cesium/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

