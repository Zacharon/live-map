[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/events"
  to = "/.netlify/functions/events"
  status = 200
  force = true

[[redirects]]
  from = "/api/changes"
  to = "/.netlify/functions/changes"
  status = 200
  force = true

[[redirects]]
